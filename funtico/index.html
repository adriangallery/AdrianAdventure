<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <!-- F0.1 (plan FUNTICO_ADVENTURE): entrada del build Funtico (`vite build --mode funtico` → dist-funtico/index.html).
       Sin cartera ni nada web3. Las rutas están escritas como se sirven desde la raíz de dist-funtico/. -->
  <title>ZEROadventure · Funtico</title>
  <link rel="icon" type="image/png" href="./favicon.png">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <script>
    // Cache buster (igual que index.html, con su propia clave): detecta HTML viejo y fuerza recarga
    (function(){
      var B='__BUILD__',K='zeroadv_funtico_v';
      var u=new URLSearchParams(location.search);
      if(u.has('_cb')){localStorage.setItem(K,B);u.delete('_cb');var s=u.toString();history.replaceState(null,'',location.pathname+(s?'?'+s:''));return;}
      var p=localStorage.getItem(K);
      localStorage.setItem(K,B);
      var go=function(){u.set('_cb',String(Date.now()));location.href=location.pathname+'?'+u.toString();};
      if(p&&p!==B){go();return;}
      fetch('./version.txt?t='+Date.now()).then(function(r){return r.text()}).then(function(v){
        v=v.trim();if(v&&v!==B&&v!=='dev'){go();}
      }).catch(function(){});
    })();
  </script>
  <style>
    @font-face {
      font-family: 'Press Start 2P';
      src: url('./assets/fonts/PressStart2P-Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      background: #06060c;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }

    #game-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #game-container canvas {
      display: block;
      image-rendering: pixelated;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
  </style>
</head>
<body>
  <div id="game-container"></div>
  <script type="module" src="../src/funtico/main.ts"></script>
</body>
</html>

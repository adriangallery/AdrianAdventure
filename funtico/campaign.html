<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <!-- F3.1 (plan FUNTICO_ADVENTURE): banco de pruebas de Campaign. El juego entero (src/main.ts) con el recolector de
       métricas instalado antes de arrancar. Solo entra en dist-funtico con FUNTICO_CAMPAIGN_HARNESS=1 (vite.config.ts),
       sale en la raíz como campaign.html y lo usa scripts/funtico/campaign-metrics-e2e.mjs. F3.2 lo sustituye. -->
  <title>%GAME_NAME% · Campaign harness</title>
  <link rel="icon" type="image/png" href="./favicon.png">
  <style>
    @font-face {
      font-family: 'Press Start 2P';
      src: url('./assets/fonts/PressStart2P-Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #06060c; touch-action: none; }
    #game-container { position: fixed; inset: 0; width: 100%; height: 100%; }
    #game-container canvas { display: block; image-rendering: pixelated; user-select: none; }
    #loading {
      position: fixed; inset: 0; background: #06060c; display: flex; align-items: center; justify-content: center;
      color: #504878; font-family: 'Press Start 2P', cursive; z-index: 100; transition: opacity 0.5s;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div id="loading"><p>Loading…</p></div>
  <div id="game-container"></div>
  <script type="module" src="../src/funtico/campaignHarness.ts"></script>
</body>
</html>

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # index.html / version.txt: never cache — the app's own client-side
    # cache-buster (inline script in index.html) compares this against
    # localStorage and forces a reload, mirroring the old Vercel headers.
    location = /index.html {
        add_header Cache-Control "public, s-maxage=0, max-age=0, must-revalidate";
    }
    location = /version.txt {
        add_header Cache-Control "no-store, max-age=0";
    }

    # Hashed/static assets: long cache.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

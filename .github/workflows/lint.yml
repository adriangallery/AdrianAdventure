# V8 (plan AdrianZERO): lint + typecheck en cada PR y push a main. Fase 1: falla con errores de ESLint y de
# TypeScript (strict ya activo en tsconfig); los avisos se listan pero no bloquean.
name: lint

on:
  pull_request:
  push:
    branches: [main]
  # A0.3: voices.yml lo lanza tras su commit (un push con GITHUB_TOKEN no dispara workflows)
  workflow_dispatch:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: ESLint (sin tocar el lockfile)
        run: npm i --no-save eslint@9 @eslint/js@9 typescript-eslint@8 globals@15
      - name: Typecheck (strict)
        run: npx tsc --noEmit
      - name: Pruebas del motor de scripts (A1.1)
        run: npm run test:engine
      - name: Pruebas del linter de escenas (A0.4)
        run: npm run test:lint
      - name: Pruebas de la cobertura de voces (A0.3)
        run: npm run test:voices
      - name: Pruebas de la lógica del runner de walkthrough (A0.5)
        run: npm run test:walkthrough:unit
      - name: Pruebas de privacidad del leaderboard (A1.6)
        run: npm run test:server
      - name: Pruebas del recorte de overlays (A2.7)
        run: npm run test:overlays
      - name: ESLint
        run: |
          set -o pipefail
          npx eslint src --format stylish | tee eslint-report.txt
          npx eslint src --format json --output-file eslint-report.json || true
          echo "### ESLint" >> "$GITHUB_STEP_SUMMARY"
          tail -n 3 eslint-report.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Informe de ESLint (artefacto)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eslint-report
          path: |
            eslint-report.txt
            eslint-report.json
          retention-days: 30
      # A0.4: contenido de las escenas. Node puro, sin dependencias. Solo (f) (assets que no existen) es error;
      # el resto son avisos en el resumen y en el artefacto. Corre aunque fallen tsc o ESLint.
      - name: Linter de escenas (A0.4)
        if: ${{ !cancelled() }}
        run: |
          set +e
          node scripts/lint-scenes.mjs
          rc=$?
          [ -f lint-scenes-report.md ] && cat lint-scenes-report.md >> "$GITHUB_STEP_SUMMARY"
          exit $rc
      - name: Informe del linter de escenas (artefacto)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-scenes-report
          path: |
            lint-scenes-report.json
            lint-scenes-report.md
          if-no-files-found: ignore
          retention-days: 30
      # A0.3: todo texto hablado tiene su mp3 y voice.config.ts está al día (scripts/voices). Excepciones con
      # motivo en qa/voice-coverage-allow.json. Si falla: etiqueta la PR con `voices` y el CI genera los clips.
      - name: Cobertura de voces (A0.3)
        if: ${{ !cancelled() }}
        run: |
          set +e
          node scripts/voice-coverage.mjs
          rc=$?
          [ -f voice-coverage-report.md ] && cat voice-coverage-report.md >> "$GITHUB_STEP_SUMMARY"
          exit $rc
      - name: Informe de cobertura de voces (artefacto)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voice-coverage-report
          path: |
            voice-coverage-report.json
            voice-coverage-report.md
          if-no-files-found: ignore
          retention-days: 30
      # A2.7: ningún overlay de escena vuelve a ser del tamaño del fondo sin necesidad, ni en PNG, ni con un `bounds`
      # que no cuadra con su imagen (con sharp, mira los píxeles). Si falla: `npm run crop:overlays` y commit.
      - name: Overlays recortados (A2.7)
        if: ${{ !cancelled() }}
        run: node scripts/crop-overlays.mjs --check
      # A5.1: cada fondo, primer plano y overlay a tamaño de fondo tiene sus variantes @1280/@2048 con la medida justa, y
      # render.world coincide con el fondo maestro. Si falla: `node scripts/make-bg-variants.mjs` y commit.
      - name: Variantes de fondo (A5.1)
        if: ${{ !cancelled() }}
        run: node scripts/make-bg-variants.mjs --check

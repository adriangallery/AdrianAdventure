# V8 (plan AdrianZERO): lint + typecheck en cada PR y push a main. Fase 1: falla con errores de ESLint y de
# TypeScript (strict ya activo en tsconfig); los avisos se listan pero no bloquean.
name: lint

on:
  pull_request:
  push:
    branches: [main]
  # A0.3: voices.yml lo lanza tras su commit (un push con GITHUB_TOKEN no dispara workflows)
  workflow_dispatch:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: ESLint (sin tocar el lockfile)
        run: npm i --no-save eslint@9 @eslint/js@9 typescript-eslint@8 globals@15
      - name: Typecheck (strict)
        run: npx tsc --noEmit
      - name: Pruebas del motor de scripts (A1.1)
        run: npm run test:engine
      - name: Pruebas del puente con Funtico (F0.2)
        run: npm run test:funtico
      - name: Pruebas del linter de escenas (A0.4)
        run: npm run test:lint
      - name: Pruebas de la cobertura de voces (A0.3)
        run: npm run test:voices
      - name: Pruebas de la lógica del runner de walkthrough (A0.5)
        run: npm run test:walkthrough:unit
      - name: Pruebas de privacidad del leaderboard (A1.6)
        run: npm run test:server
      - name: Pruebas del recorte de overlays (A2.7)
        run: npm run test:overlays
      - name: ESLint
        run: |
          set -o pipefail
          npx eslint src --format stylish | tee eslint-report.txt
          npx eslint src --format json --output-file eslint-report.json || true
          echo "### ESLint" >> "$GITHUB_STEP_SUMMARY"
          tail -n 3 eslint-report.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Informe de ESLint (artefacto)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eslint-report
          path: |
            eslint-report.txt
            eslint-report.json
          retention-days: 30
      # A0.4: contenido de las escenas. Node puro, sin dependencias. Solo (f) (assets que no existen) es error;
      # el resto son avisos en el resumen y en el artefacto. Corre aunque fallen tsc o ESLint.
      - name: Linter de escenas (A0.4)
        if: ${{ !cancelled() }}
        run: |
          set +e
          node scripts/lint-scenes.mjs
          rc=$?
          [ -f lint-scenes-report.md ] && cat lint-scenes-report.md >> "$GITHUB_STEP_SUMMARY"
          exit $rc
      - name: Informe del linter de escenas (artefacto)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-scenes-report
          path: |
            lint-scenes-report.json
            lint-scenes-report.md
          if-no-files-found: ignore
          retention-days: 30
      # A0.3: todo texto hablado tiene su mp3 y voice.config.ts está al día (scripts/voices). Excepciones con
      # motivo en qa/voice-coverage-allow.json. Si falla: etiqueta la PR con `voices` y el CI genera los clips.
      - name: Cobertura de voces (A0.3)
        if: ${{ !cancelled() }}
        run: |
          set +e
          node scripts/voice-coverage.mjs
          rc=$?
          [ -f voice-coverage-report.md ] && cat voice-coverage-report.md >> "$GITHUB_STEP_SUMMARY"
          exit $rc
      - name: Informe de cobertura de voces (artefacto)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voice-coverage-report
          path: |
            voice-coverage-report.json
            voice-coverage-report.md
          if-no-files-found: ignore
          retention-days: 30
      # A9.23: voces nuevas sin ElevenLabs. voices.yml genera lo que falta con Kokoro, así que una frase nueva sonaría con
      # otra voz y el CI saldría en verde. Guion congelado al día (script-lock --check) y lo pendiente con ElevenLabs
      # (--dry-run: sin clave ni llamadas a la API). Si hay algo, aviso visible (::warning::) y en el resumen, sin fallar:
      # generar gasta créditos y lo decide Adrián.
      - name: Voces pendientes con ElevenLabs (A9.23)
        if: ${{ !cancelled() }}
        env:
          ELEVENLABS_API_KEY: ''
        run: |
          set +e
          {
            echo "### Voces con ElevenLabs (A9.23)"
          } >> "$GITHUB_STEP_SUMMARY"
          lock_out=$(node scripts/voices/script-lock.mjs --check 2>&1); lock_rc=$?
          echo "$lock_out"
          if [ $lock_rc -ne 0 ]; then
            echo "::warning title=Guion de voces desactualizado (A9.23)::qa/voices-script.lock.json no está al día: node scripts/voices/script-lock.mjs y commit; luego las voces nuevas con ElevenLabs"
            echo "- ⚠️ \`qa/voices-script.lock.json\` no está al día: \`node scripts/voices/script-lock.mjs\` y commit." >> "$GITHUB_STEP_SUMMARY"
          fi
          dry=$(node scripts/voices/eleven-tts.mjs --dry-run 2>&1); dry_rc=$?
          echo "$dry"
          if [ $dry_rc -ne 0 ]; then
            echo "::warning title=Dry-run de ElevenLabs falló (A9.23)::node scripts/voices/eleven-tts.mjs --dry-run salió con $dry_rc"
            echo "- ⚠️ el \`--dry-run\` de ElevenLabs falló (rc $dry_rc), ver el log del paso." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          pending=$(printf '%s\n' "$dry" | awk -F'\t' '/^TOTAL pendiente/ {print $3}')
          credits=$(printf '%s\n' "$dry" | awk -F'\t' '/^TOTAL pendiente/ {print $5}')
          if [ -n "$pending" ] && [ "$pending" != "0" ]; then
            echo "::warning title=Voces pendientes con ElevenLabs (A9.23)::$pending frase(s) sin voz de ElevenLabs (~$credits créditos): sonarán con Kokoro. Generar: node scripts/voices/eleven-tts.mjs --limite-creditos <n> (ver scripts/voices/eleven-tts.mjs)"
            {
              echo "- ⚠️ **$pending frase(s) pendientes** con ElevenLabs (~$credits créditos medidos): mientras tanto suenan con Kokoro."
              echo "  Generar: \`node scripts/voices/eleven-tts.mjs --limite-creditos <n>\`"
              echo '```'
              printf '%s\n' "$dry"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- ✓ 0 frases pendientes con ElevenLabs (según el guion congelado)." >> "$GITHUB_STEP_SUMMARY"
          fi
      # A2.7: ningún overlay de escena vuelve a ser del tamaño del fondo sin necesidad, ni en PNG, ni con un `bounds`
      # que no cuadra con su imagen (con sharp, mira los píxeles). Si falla: `npm run crop:overlays` y commit.
      - name: Overlays recortados (A2.7)
        if: ${{ !cancelled() }}
        run: node scripts/crop-overlays.mjs --check
      # A5.1: cada fondo, primer plano y overlay a tamaño de fondo tiene sus variantes @1280/@2048 con la medida justa, y
      # render.world coincide con el fondo maestro. Si falla: `node scripts/make-bg-variants.mjs` y commit.
      - name: Variantes de fondo (A5.1)
        if: ${{ !cancelled() }}
        run: node scripts/make-bg-variants.mjs --check

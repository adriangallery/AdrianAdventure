# V8 (plan AdrianZERO): lint + typecheck en cada PR y push a main. Fase 1: falla con errores de ESLint y de
# TypeScript (strict ya activo en tsconfig); los avisos se listan pero no bloquean.
name: lint

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: ESLint (sin tocar el lockfile)
        run: npm i --no-save eslint@9 @eslint/js@9 typescript-eslint@8 globals@15
      - name: Typecheck (strict)
        run: npx tsc --noEmit
      - name: ESLint
        run: |
          set -o pipefail
          npx eslint src --format stylish | tee eslint-report.txt
          npx eslint src --format json --output-file eslint-report.json || true
          echo "### ESLint" >> "$GITHUB_STEP_SUMMARY"
          tail -n 3 eslint-report.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Informe de ESLint (artefacto)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eslint-report
          path: |
            eslint-report.txt
            eslint-report.json
          retention-days: 30

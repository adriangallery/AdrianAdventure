# Build de AdrianAdventure en cada PR (plan AdrianZERO V8, primer paso). El portátil no puede
# compilar y el mini es producción: aquí se comprueba que `tsc` y `vite build` pasan antes de
# desplegar con `git push dokku`.
# A0.1 (plan SCUMM): job `walkthrough` (ruta crítica y atajos con la API ?qa=1, ver qa/README.md), también en
# `main`, y `workflow_dispatch` con BASE_URL para lanzar smoke y walkthrough contra una URL ya desplegada.
# A0.2 (plan SCUMM): job `demo`, que graba las demos visuales `scripts/demo-*.mjs` y sube sus GIF
# (sustituye a los jobs `demo-v6` y `demo-a1-3`).
name: build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      BASE_URL:
        description: 'URL ya desplegada para smoke, walkthrough y demos (p. ej. https://adventure.zerothetoken.com). Vacío = compilar y probar el build.'
        required: false
        default: ''
      DEMOS:
        description: 'Demos a grabar, separadas por espacios (p. ej. "hold a1-3-poster-lobby"). Vacío = todas.'
        required: false
        default: ''

concurrency:
  group: build-${{ github.event_name }}-${{ github.ref }}-${{ inputs.BASE_URL }}-${{ inputs.DEMOS }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    if: ${{ !inputs.BASE_URL }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Vite build (sin copiar assets)
        run: npx vite build

  smoke:
    # V8: arranque, cada escena, cambio de escena y guardar/cargar en Chrome headless contra el build real
    needs: build
    if: ${{ !cancelled() && (needs.build.result == 'success' || (needs.build.result == 'skipped' && inputs.BASE_URL)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build con assets (igual que el Dockerfile del mini)
        if: ${{ !inputs.BASE_URL }}
        run: npm run build

      - name: Servir el build
        if: ${{ !inputs.BASE_URL }}
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 --strictPort > preview.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat preview.log; exit 1

      - name: Tests de humo
        run: npm run test:smoke
        env:
          BASE_URL: ${{ inputs.BASE_URL || 'http://127.0.0.1:4173' }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-shots
          path: smoke-shots/

  walkthrough:
    # A0.1: New Game → créditos con la API de QA y atajos de secuencia (qa/*.json); capturas por paso
    needs: build
    if: ${{ !cancelled() && (needs.build.result == 'success' || (needs.build.result == 'skipped' && inputs.BASE_URL)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build con assets (igual que el Dockerfile del mini)
        if: ${{ !inputs.BASE_URL }}
        run: npm run build

      - name: Servir el build
        if: ${{ !inputs.BASE_URL }}
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 --strictPort > preview.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat preview.log; exit 1

      - name: Recorrido y atajos
        run: npm run test:walkthrough -- qa/walkthrough.json qa/sequence-breaks.json
        env:
          BASE_URL: ${{ inputs.BASE_URL || 'http://127.0.0.1:4173' }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: walkthrough-shots
          path: walkthrough-shots/

  demo:
    # A0.2 (regla visual del plan): GIF de cada demo `scripts/demo-*.mjs` (grabación en scripts/lib/demo.mjs).
    # En PRs de ramas scumm/* y feat/*: las demos que la PR añade o cambia (todas si cambia la librería). A mano
    # (Run workflow): las de DEMOS o todas. Si no hay demos que grabar, termina en verde sin compilar.
    needs: build
    if: ${{ !cancelled() && (startsWith(github.head_ref, 'scumm/') || startsWith(github.head_ref, 'feat/') || github.event_name == 'workflow_dispatch') && (needs.build.result == 'success' || (needs.build.result == 'skipped' && inputs.BASE_URL)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # En pull_request HEAD es el merge con main: HEAD^1 es main y el diff es exactamente la PR
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Elegir demos
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          DEMOS: ${{ inputs.DEMOS }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            list=$(node scripts/lib/demo.mjs list --changed HEAD^1)
          elif [ -n "$DEMOS" ]; then
            list="$DEMOS"
          else
            list=$(node scripts/lib/demo.mjs list)
          fi
          echo "list=$list" >> "$GITHUB_OUTPUT"
          if [ -n "$list" ]; then
            echo "Demos: $list"
          else
            echo "Sin demos que grabar en este cambio" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - run: npm ci
        if: steps.pick.outputs.list != ''

      - name: Build con assets (igual que el Dockerfile del mini)
        if: ${{ steps.pick.outputs.list != '' && !inputs.BASE_URL }}
        run: npm run build

      - name: Servir el build
        if: ${{ steps.pick.outputs.list != '' && !inputs.BASE_URL }}
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 --strictPort > preview.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat preview.log; exit 1

      - name: ffmpeg
        if: steps.pick.outputs.list != ''
        run: |
          command -v ffmpeg >/dev/null || sudo apt-get install -y -qq ffmpeg >/dev/null \
            || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null; }
          ffmpeg -version | head -n 1

      - name: Grabar demos y generar GIF
        if: steps.pick.outputs.list != ''
        run: node scripts/lib/demo.mjs run $LIST
        env:
          LIST: ${{ steps.pick.outputs.list }}
          BASE_URL: ${{ inputs.BASE_URL || 'http://127.0.0.1:4173' }}

      - name: GIF y capturas (artefacto demo-gifs)
        if: ${{ always() && steps.pick.outputs.list != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: demo-gifs
          if-no-files-found: warn
          path: |
            demo-out/report.json
            demo-out/*/*.gif
            demo-out/*/*.png
            demo-out/*/log.txt

      - name: Fotogramas (artefacto demo-frames)
        if: ${{ always() && steps.pick.outputs.list != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: demo-frames
          if-no-files-found: ignore
          retention-days: 7
          path: demo-out/*/frames/

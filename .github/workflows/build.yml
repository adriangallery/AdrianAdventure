# Build de AdrianAdventure en cada PR (plan AdrianZERO V8, primer paso). El portátil no puede
# compilar y el mini es producción: aquí se comprueba que `tsc` y `vite build` pasan antes de
# desplegar con `git push dokku`.
name: build

on:
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Vite build (sin copiar assets)
        run: npx vite build

  smoke:
    # V8: arranque, cada escena, cambio de escena y guardar/cargar en Chrome headless contra el build real
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build con assets (igual que el Dockerfile del mini)
        run: npm run build

      - name: Servir el build
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 --strictPort > preview.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat preview.log; exit 1

      - name: Tests de humo
        run: npm run test:smoke
        env:
          BASE_URL: http://127.0.0.1:4173

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-shots
          path: smoke-shots/

  demo-v6:
    # GIF de demostración para Adrián (regla visual del plan) — solo en la rama de V6
    if: startsWith(github.head_ref, 'feat/v6')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Servir el build
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 --strictPort > preview.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat preview.log; exit 1

      - name: Grabar el toque
        id: demo
        continue-on-error: true
        run: node scripts/demo-touch.mjs
        env:
          BASE_URL: http://127.0.0.1:4173

      - name: Grabar tocar = mirar / mantener = acción
        id: demohold
        continue-on-error: true
        run: node scripts/demo-hold.mjs
        env:
          BASE_URL: http://127.0.0.1:4173

      - name: Grabar mantener = avance rápido de cinemática
        id: demoskip
        continue-on-error: true
        run: node scripts/demo-skip.mjs
        env:
          BASE_URL: http://127.0.0.1:4173

      - name: Grabar autoguardado y continuar
        id: demoautosave
        continue-on-error: true
        run: node scripts/demo-autosave.mjs
        env:
          BASE_URL: http://127.0.0.1:4173

      - name: Grabar pista por inactividad
        id: demohints
        continue-on-error: true
        run: node scripts/demo-hints.mjs
        env:
          BASE_URL: http://127.0.0.1:4173

      - name: Grabar panel de verbos contextual
        id: demoverbs
        continue-on-error: true
        run: node scripts/demo-verbs.mjs
        env:
          BASE_URL: http://127.0.0.1:4173

      - name: Grabar ajustes
        id: demosettings
        continue-on-error: true
        run: node scripts/demo-settings.mjs
        env:
          BASE_URL: http://127.0.0.1:4173

      - name: GIF
        if: always()
        run: |
          sudo apt-get install -y -qq ffmpeg >/dev/null
          ffmpeg -loglevel error -y -framerate 12 -i demo-frames/%03d.png \
            -vf "fps=12,scale=520:-1:flags=neighbor,split[a][b];[a]palettegen[p];[b][p]paletteuse" demo-v6-touch.gif
          ls -la demo-v6-touch.gif
          if ls demo-hold-frames/*.png >/dev/null 2>&1; then
            ffmpeg -loglevel error -y -framerate 12 -i demo-hold-frames/%03d.png \
              -vf "fps=12,scale=640:-1:flags=neighbor,split[a][b];[a]palettegen[p];[b][p]paletteuse" demo-v6-hold.gif
            ls -la demo-v6-hold.gif
          fi
          if ls demo-settings-frames/*.png >/dev/null 2>&1; then
            ffmpeg -loglevel error -y -framerate 4 -i demo-settings-frames/%03d.png \
              -vf "fps=4,scale=640:-1:flags=neighbor,split[a][b];[a]palettegen[p];[b][p]paletteuse" demo-v6-settings.gif
            ls -la demo-v6-settings.gif
          fi
          if ls demo-verbs-frames/*.png >/dev/null 2>&1; then
            ffmpeg -loglevel error -y -framerate 6 -i demo-verbs-frames/%03d.png \
              -vf "fps=6,scale=640:-1:flags=neighbor,split[a][b];[a]palettegen[p];[b][p]paletteuse" demo-v6-verbs.gif
            ls -la demo-v6-verbs.gif
          fi
          if ls demo-hints-frames/*.png >/dev/null 2>&1; then
            ffmpeg -loglevel error -y -framerate 8 -i demo-hints-frames/%03d.png \
              -vf "fps=8,scale=640:-1:flags=neighbor,split[a][b];[a]palettegen[p];[b][p]paletteuse" demo-v6-hints.gif
            ls -la demo-v6-hints.gif
          fi
          if ls demo-autosave-frames/*.png >/dev/null 2>&1; then
            ffmpeg -loglevel error -y -framerate 8 -i demo-autosave-frames/%03d.png \
              -vf "fps=8,scale=640:-1:flags=neighbor,split[a][b];[a]palettegen[p];[b][p]paletteuse" demo-v6-autosave.gif
            ls -la demo-v6-autosave.gif
          fi
          if ls demo-skip-frames/*.png >/dev/null 2>&1; then
            ffmpeg -loglevel error -y -framerate 12 -i demo-skip-frames/%03d.png \
              -vf "fps=12,scale=640:-1:flags=neighbor,split[a][b];[a]palettegen[p];[b][p]paletteuse" demo-v6-skip.gif
            ls -la demo-v6-skip.gif
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-v6
          path: |
            demo-v6-touch.gif
            demo-full.png
            demo-frames/
            demo-v6-hold.gif
            demo-hold-full.png
            demo-v6-skip.gif
            demo-skip-full.png
            demo-v6-autosave.gif
            demo-autosave-menu.png
            demo-v6-hints.gif
            demo-hints-full.png
            demo-v6-verbs.gif
            demo-verbs-full.png
            demo-v6-settings.gif
            demo-settings-full.png

      - name: Resultado de la demo
        if: steps.demo.outcome == 'failure' || steps.demohold.outcome == 'failure' || steps.demoskip.outcome == 'failure' || steps.demoautosave.outcome == 'failure' || steps.demohints.outcome == 'failure' || steps.demoverbs.outcome == 'failure' || steps.demosettings.outcome == 'failure'
        run: exit 1

  demo-a1-3:
    # Plan SCUMM A1.3 (regla visual): captura y GIF del póster del lobby. Provisional hasta que A0.2
    # convierta estos jobs en uno genérico que ejecute scripts/demo-*.mjs.
    if: startsWith(github.head_ref, 'scumm/a1-3') || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Servir el build
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 --strictPort > preview.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat preview.log; exit 1

      - name: Grabar el póster del lobby
        run: node scripts/demo-a1-3-poster-lobby.mjs
        env:
          BASE_URL: http://127.0.0.1:4173

      - name: GIF
        if: always()
        run: |
          if ls demo-a1-3-frames/*.png >/dev/null 2>&1; then
            sudo apt-get install -y -qq ffmpeg >/dev/null
            ffmpeg -loglevel error -y -framerate 4 -i demo-a1-3-frames/%03d.png \
              -vf "fps=4,scale=640:-1:flags=neighbor,split[a][b];[a]palettegen[p];[b][p]paletteuse" demo-a1-3-poster-lobby.gif
            ls -la demo-a1-3-poster-lobby.gif
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-a1-3-poster-lobby
          path: |
            demo-a1-3-poster-lobby.gif
            demo-a1-3-poster-lobby.png
            demo-a1-3-frames/


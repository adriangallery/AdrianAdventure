# F0.1 (plan FUNTICO_ADVENTURE): nginx del build Funtico (Dockerfile.funtico, sirve dist-funtico/). Igual que
# nginx.conf pero sin /stats (el build Funtico no lo lleva) y sin indexar.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Robots-Tag "noindex, nofollow" always;

    # index.html / version.txt: never cache — the app's own client-side
    # cache-buster (inline script in index.html) compares this against
    # localStorage and forces a reload.
    location = /index.html {
        add_header Cache-Control "public, s-maxage=0, max-age=0, must-revalidate";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    location = /version.txt {
        add_header Cache-Control "no-store, max-age=0";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Hashed/static assets: long cache.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
